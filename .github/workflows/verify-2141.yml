name: Compare existing Erlang failures against baseline
on:
  push:
    branches: [verify/2141-elp-stale-requests]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: '27.3'
          rebar3-version: '3.24.0'
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - name: Reproduce downstream assertions on unchanged baseline
        run: |
          git diff --exit-code dc09f0851f014efaa4951e3a2bdfeb57917c542a -- src test uv.lock
          git worktree add --detach /tmp/serena-baseline 96c27473f4402c649f8d01ea7ba00eb0d1061fba
          export PYTHONPATH=/tmp/serena-baseline/src:/tmp/serena-baseline:$GITHUB_WORKSPACE/scripts
          cd /tmp/serena-baseline
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import solidlsp; print(solidlsp.__file__)'
          set +e
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest test/solidlsp/erlang/test_erlang_basic.py test/solidlsp/erlang/test_erlang_symbol_retrieval.py -k 'bare_symbol_names or request_defining_symbol_record_usage' -p verify_elp_2141_warm_baseline --junitxml=/tmp/baseline.xml -q > /tmp/baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/baseline.log
          test "$result" -eq 1
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import xml.etree.ElementTree as ET; root=ET.parse("/tmp/baseline.xml"); failed={case.attrib["name"] for case in root.iter("testcase") if case.find("failure") is not None}; expected={"test_bare_symbol_names[erlang]", "test_request_defining_symbol_record_usage[erlang]"}; print("Baseline failures:", failed); assert failed == expected; messages=" ".join(f.attrib.get("message", "") for f in root.iter("failure")); assert "malformed symbols" in messages and "records.hrl" in messages, messages'
